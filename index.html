<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Convivencia AEC 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f2ec; color: #2b2519; }
    header { background: #1d3a5f; color: #fdfcf8; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #c9b06a; }
    nav { background: #fff; padding: 10px 20px; display: flex; gap: 10px; overflow-x: auto; border-bottom: 1px solid #e6dfcd; }
    nav button { padding: 8px 14px; background: transparent; border: none; color: #5a5346; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; border-bottom: 3px solid transparent; }
    nav button.on { color: #1d3a5f; border-bottom-color: #c9b06a; }
    main { max-width: 800px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .login-form { max-width: 380px; margin: 40px auto; }
    h2 { font-size: 20px; color: #1d3a5f; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #c9b06a; padding-bottom: 10px; }
    label { display: block; font-size: 12px; text-transform: uppercase; color: #5a5346; margin: 12px 0 4px; }
    input, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #b8ae95; border-radius: 3px; font-size: 15px; }
    input:focus, select:focus { outline: 2px solid #8a6d2f; }
    button { width: 100%; padding: 12px; background: #1d3a5f; color: #fdfcf8; border: none; border-radius: 3px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0f2342; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { padding: 10px; margin: 10px 0; border-radius: 3px; font-size: 14px; }
    .success { background: #eef2ec; color: #2e5e3f; border-left: 4px solid #2e5e3f; }
    .error { background: #f6e3e0; color: #a34434; border-left: 4px solid #a34434; }
    .info { background: #f0f4f8; color: #1d3a5f; border-left: 4px solid #1d3a5f; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px; background: #1d3a5f; color: #fdfcf8; }
    td { padding: 8px; border-bottom: 1px solid #e6dfcd; }
    footer { text-align: center; font-size: 12px; color: #8a8069; margin-top: 40px; padding: 20px; }
    .status { font-size: 12px; color: #8a8069; margin-top: 20px; }
  </style>
</head>
<body>

<header>
  <h1>Registro de Convivencia AEC 2026</h1>
  <div class="sub">Sistema compartido · Colegio FASTA Juan Pablo II</div>
</header>

<!-- SUPABASE CDN - CARGAR PRIMERO -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>

<nav id="navTabs"></nav>
<main id="contenido"></main>
<footer id="footer"></footer>

<script>
// ============================================================================
// CONFIG
// ============================================================================
const URL_SUPABASE = 'https://navsfrfgyyjxckmincmb.supabase.co';
const KEY_SUPABASE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hdnNmcmZneXlqeGNrbWluY21iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDg0ODAsImV4cCI6MjEwNDI4NDQ4MH0.IWCyH9HvskRRU6pG4e2_1BvQI84qPnSnBmiQBa_q45o';

let supabase = null;
let usuario = null;
let rol = null;
let alumnos = [];
let docentes = [];
let registros = [];

// ============================================================================
// INICIAR
// ============================================================================
function inicializar() {
  console.log('Inicializando...');
  
  // Esperar a que Supabase cargue
  if (typeof window.supabase === 'undefined') {
    console.log('Supabase no listo, esperando...');
    setTimeout(inicializar, 500);
    return;
  }
  
  try {
    supabase = window.supabase.createClient(URL_SUPABASE, KEY_SUPABASE);
    console.log('✓ Supabase creado correctamente');
  } catch (e) {
    console.error('Error creando Supabase:', e);
    document.getElementById('contenido').innerHTML = '<div class="card"><h2 style="color:#a34434">Error</h2><p>' + e.message + '</p></div>';
    return;
  }
  
  verificarSesion();
}

async function verificarSesion() {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      usuario = session.user;
      cargarDatos();
      mostrarApp();
    } else {
      mostrarLogin();
    }
  } catch (e) {
    console.error('Error verificando sesión:', e);
    mostrarLogin();
  }
}

// ============================================================================
// LOGIN
// ============================================================================
function mostrarLogin() {
  document.getElementById('navTabs').innerHTML = '';
  document.getElementById('contenido').innerHTML = 
    '<div class="login-form">' +
      '<div class="card">' +
        '<h2>🔐 Acceso</h2>' +
        '<label>Email</label>' +
        '<input id="email" type="email" value="manologuevara2013@icloud.com">' +
        '<label>Contraseña</label>' +
        '<input id="pass" type="password" value="direccion123">' +
        '<button onclick="hacerLogin()">Ingresar</button>' +
        '<button onclick="hacerRegistro()" style="background:#2e5e3f;margin-top:8px">Crear cuenta nueva</button>' +
        '<div id="msgLogin" class="status"></div>' +
      '</div>' +
    '</div>';
  
  document.getElementById('footer').innerHTML = 
    '<div style="color:#1d3a5f;font-weight:700">© 2026 Eduardo H. Guevara</div>' +
    '<div>Colegio FASTA Juan Pablo II</div>' +
    '<div style="margin-top:8px;font-size:11px;color:#c9b06a">Versión 3.1 Supabase</div>';
}

async function hacerRegistro() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  
  if (!email || !pass) {
    mostrarMsg('error', 'Ingresá email y contraseña');
    return;
  }
  
  if (pass.length < 6) {
    mostrarMsg('error', 'La contraseña debe tener al menos 6 caracteres');
    return;
  }
  
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Creando cuenta...';
  
  try {
    const { data, error } = await supabase.auth.signUp({ email, password: pass });
    if (error) throw error;
    
    mostrarMsg('success', '✓ Cuenta creada! Ahora tocá "Ingresar"');
  } catch (e) {
    mostrarMsg('error', 'Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Crear cuenta nueva';
  }
}

async function hacerLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  
  if (!email || !pass) {
    mostrarMsg('error', 'Ingresá email y contraseña');
    return;
  }
  
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    
    usuario = data.user;
    cargarDatos();
    mostrarApp();
  } catch (e) {
    mostrarMsg('error', 'Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
}

// ============================================================================
// APP
// ============================================================================
async function cargarDatos() {
  try {
    const { data: a } = await supabase.from('alumnos').select('*').eq('activo', true);
    const { data: d } = await supabase.from('docentes').select('*').eq('activo', true);
    const { data: r } = await supabase.from('registros').select('*');
    
    alumnos = a || [];
    docentes = d || [];
    registros = r || [];
    
    console.log('✓ Datos cargados:', alumnos.length, docentes.length, registros.length);
  } catch (e) {
    console.error('Error cargando datos:', e);
  }
}

function mostrarApp() {
  document.getElementById('navTabs').innerHTML = 
    '<button class="on" onclick="irTab(\'inicio\')" style="text-align:left;padding:8px 12px">🏠 Inicio</button>' +
    '<button onclick="irTab(\'alumnos\')" style="text-align:left;padding:8px 12px">👥 Alumnos</button>' +
    '<button onclick="irTab(\'docentes\')" style="text-align:left;padding:8px 12px">👨‍🏫 Docentes</button>' +
    '<button onclick="cerrarSesion()" style="margin-left:auto;padding:8px 12px;background:#a34434;color:#fdfcf8;border:none;border-radius:3px;cursor:pointer">Salir</button>';
  
  document.getElementById('contenido').innerHTML = 
    '<div class="card">' +
      '<h2>Bienvenido</h2>' +
      '<p>Email: <strong>' + usuario.email + '</strong></p>' +
      '<p style="margin-top:12px;color:#8a8069">Alumnos: <strong>' + alumnos.length + '</strong><br>' +
      'Docentes: <strong>' + docentes.length + '</strong><br>' +
      'Registros: <strong>' + registros.length + '</strong></p>' +
      '<div class="success msg" style="margin-top:20px">✓ Conectado a Supabase</div>' +
    '</div>';
  
  document.getElementById('footer').innerHTML = 
    '<div style="color:#1d3a5f;font-weight:700">© 2026 Eduardo H. Guevara</div>' +
    '<div>Colegio FASTA Juan Pablo II</div>' +
    '<div style="margin-top:8px;font-size:11px;color:#c9b06a">Versión 3.0 Supabase · ✓ Conectado</div>';
}

function irTab(tab) {
  const btns = document.querySelectorAll('nav button');
  btns.forEach(b => b.classList.remove('on'));
  event.target.classList.add('on');
  
  if (tab === 'inicio') mostrarInicio();
  else if (tab === 'alumnos') mostrarAlumnos();
  else if (tab === 'docentes') mostrarDocentes();
}

function mostrarInicio() {
  document.getElementById('contenido').innerHTML = 
    '<div class="card"><h2>📊 Dashboard</h2>' +
    '<p>Alumnos: <strong>' + alumnos.length + '</strong></p>' +
    '<p>Docentes: <strong>' + docentes.length + '</strong></p>' +
    '<p>Registros: <strong>' + registros.length + '</strong></p>' +
    '</div>';
}

function mostrarAlumnos() {
  if (alumnos.length === 0) {
    document.getElementById('contenido').innerHTML = '<div class="card"><h2>Alumnos</h2><p style="color:#8a8069">Sin datos</p></div>';
    return;
  }
  
  let html = '<div class="card"><h2>Alumnos</h2><table><thead><tr><th>Nombre</th><th>Nivel</th><th>Grado</th></tr></thead><tbody>';
  alumnos.forEach(a => {
    html += '<tr><td>' + a.nombre + '</td><td>' + a.nivel + '</td><td>' + a.grado + '</td></tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('contenido').innerHTML = html;
}

function mostrarDocentes() {
  if (docentes.length === 0) {
    document.getElementById('contenido').innerHTML = '<div class="card"><h2>Docentes</h2><p style="color:#8a8069">Sin datos</p></div>';
    return;
  }
  
  let html = '<div class="card"><h2>Docentes</h2><table><thead><tr><th>Nombre</th><th>Rol</th></tr></thead><tbody>';
  docentes.forEach(d => {
    html += '<tr><td>' + d.nombre + '</td><td>' + d.rol + '</td></tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('contenido').innerHTML = html;
}

async function cerrarSesion() {
  await supabase.auth.signOut();
  usuario = null;
  mostrarLogin();
}

function mostrarMsg(tipo, texto) {
  const div = document.getElementById('msgLogin');
  if (div) {
    div.innerHTML = '<div class="' + tipo + ' msg">' + texto + '</div>';
    setTimeout(() => { div.innerHTML = ''; }, 5000);
  }
}

// ============================================================================
// ARRANCAR
// ============================================================================
window.addEventListener('load', inicializar);
</script>

</body>
</html>
